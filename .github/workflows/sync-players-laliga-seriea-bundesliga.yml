name: Sync La Liga/Serie A/Bundesliga Players

on:
  schedule:
    - cron: '0 7,19 * * *'
  workflow_dispatch: {}

jobs:
  sync-players:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/populatePlayersLaLigaSerieABundesligaEspn.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}