name: Sync La Liga Stats

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Sync La Liga goals/assists
        run: node scripts/populateEventsLaLigaBBS.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}

      - name: Sync La Liga cards
        run: node scripts/populateCardsLaLigaEspn.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}