name: Sync Stats and Players

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Sync UCL events (goals/cards/assists)
        run: node scripts/populateEvents.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}

      - name: Sync EPL events (goals/cards/assists)
        run: node scripts/populateEventsEPL.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}

      - name: Sync UCL players
        run: node scripts/populatePlayers.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}

      - name: Sync EPL players
        run: node scripts/populatePlayersEPL.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}