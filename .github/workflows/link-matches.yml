name: Link Highlightly Matches

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Link matches to Highlightly IDs
        run: node scripts/linkHighlightlyMatches.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}